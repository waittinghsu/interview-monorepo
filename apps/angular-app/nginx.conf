# ============================================
# SPA Routing 設定
# ============================================
# Angular 使用 client-side routing，所有路由路徑
# （/group/xxx、/member/xxx 等）都需要由 index.html 處理，
# 而非 nginx 去找對應的檔案。
#
# try_files 的運作方式：
#   1. 先找是否有對應的靜態檔（JS、CSS、圖片）
#   2. 找不到就 fallback 到 /index.html
#   3. Angular Router 接手處理路由
# ============================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 啟用 gzip 壓縮（加速傳輸）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # SPA fallback — 所有未匹配的路徑都導向 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 靜態資源長期快取
    # Angular 的 output hashing 會在檔名加上 hash（如 main.abc123.js），
    # 內容改變時 hash 也會變，所以可以安全地設定超長快取時間。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
