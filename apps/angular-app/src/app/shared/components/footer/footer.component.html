<!--
  FooterComponent 模板 — Seoul Editorial 風格頁尾

  【Vue 對比】
  這個模板非常簡單，Vue 版本幾乎一樣：
    <footer class="text-center border-t text-textMuted py-4 font-display">
      K — HUB · Seoul Editorial
    </footer>

  差別只在 class 命名方式：
  - Vue 用 UnoCSS utility class（text-center、border-t）
  - Angular 用 BEM class（footer、footer__text）
-->

<footer class="footer">
  <span class="footer__text font-display">
    K <span class="footer__dash">&mdash;</span> HUB &middot; Seoul Editorial
  </span>
</footer>
