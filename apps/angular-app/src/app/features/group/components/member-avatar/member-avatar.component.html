<!--
  成員頭像元件模板

  ============================================================
  【Vue 對比】展示元件的模板語法差異
  ============================================================

  Vue MemberCard.vue 的模板結構：
    <div @click="emit('click', member.id)" class="cursor-pointer text-center">
      <div class="w-16 h-16 rounded-full overflow-hidden border-2" :style="{ borderColor: member.color }">
        <img v-if="member.photo" :src="member.photo" />
        <div v-else class="fallback">{{ member.name.charAt(0) }}</div>
      </div>
      <p class="text-xs mt-1">{{ member.name }}</p>
    </div>

  Angular 版本：
  - @click → (click)
  - :src → [src]
  - v-if/v-else → *ngIf/else + ng-template
  - :style → [ngStyle]
  ============================================================
-->

<!--
  主容器
  [class.member-avatar--clickable]：動態 CSS class 綁定

  【Vue 對比】
  Vue：:class="{ 'cursor-pointer': clickable }"
  Angular：[class.member-avatar--clickable]="clickable"
-->
<div
  class="member-avatar"
  [class.member-avatar--clickable]="clickable"
  (click)="onAvatarClick()"
>
  <!--
    圓形頭像

    【Vue 對比】
    Vue：<div class="w-16 h-16 rounded-full border-2" :style="{ borderColor: member.color }">
    Angular：[ngStyle]="getAvatarBorderStyle()"
  -->
  <div class="member-avatar__circle" [ngStyle]="getAvatarBorderStyle()">
    <!-- 有照片時顯示圖片 -->
    <img
      *ngIf="member.photo; else avatarFallback"
      [src]="member.photo"
      [alt]="member.name"
      class="member-avatar__image"
    >
    <!-- 無照片時顯示首字漸層備用 -->
    <ng-template #avatarFallback>
      <div
        class="member-avatar__fallback"
        [ngStyle]="getFallbackStyle()"
      >
        <span class="member-avatar__initial">{{ getInitial() }}</span>
      </div>
    </ng-template>
  </div>

  <!-- 成員姓名 -->
  <p class="member-avatar__name">{{ member.name }}</p>

  <!-- 韓文名（較小字體） -->
  <p class="member-avatar__korean-name">{{ member.koreanName }}</p>
</div>
